services:
  postgres:
    image: postgres:15
    container_name: gerenciador_torneios_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gerenciador_torneios
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    build: .
    container_name: gerenciador_torneios_api
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data: